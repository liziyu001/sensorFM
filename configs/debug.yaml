# Tiny config: runs on CPU in a few minutes. Use this for shape tests and
# the "overfit one batch" sanity check.
model:
  n_channels: 34
  window_minutes: 1440
  patch_time: 20
  d_model: 64
  enc_layers: 2
  enc_heads: 1
  mlp_ratio: 4.0
  d_dec: 48
  dec_layers: 1
  dec_heads: 1
  dropout: 0.0

data:
  n_subjects: 8
  days_per_subject: 4
  window_minutes: 1440
  seed: 0
  missing_mcar_rate: 0.02
  missing_block_prob: 0.3
  missing_block_hours: [1.0, 4.0]
  missing_modality_prob: 0.2

aim:
  random_ratio: 0.8
  temporal_ratio: 0.5
  modality_ratio: 0.5
  mode_probs: [0.3333, 0.3333, 0.3334]

train:
  batch_size: 4
  lr: 0.0005
  weight_decay: 0.0001
  max_steps: 50
  warmup_pct: 0.05
  grad_clip: 1.0
  amp: false
  log_every: 5
  num_workers: 0
  device: cpu
  out_dir: runs/debug
  seed: 0
